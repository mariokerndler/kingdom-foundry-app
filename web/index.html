<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kingdom Foundry — automated kingdom generation for a deck-building card game.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kingdom Foundry">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kingdom Foundry</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0F172A;
    }

    /* Splash shown while the Flutter engine boots */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0F172A;
      gap: 16px;
    }

    #splash h1 {
      margin: 0;
    }

    #splash img {
      display: block;
      width: min(280px, 80vw);
      height: auto;
    }

    #splash p {
      color: #FFF8E7;
      font-family: sans-serif;
      font-size: 13px;
      margin: 0;
    }

    /* Gold spinner */
    #splash .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #334155;
      border-top-color: #E4BC52;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #startup-retry {
      border: 1px solid #E4BC52;
      border-radius: 6px;
      padding: 8px 14px;
      background: #E4BC52;
      color: #0F172A;
      font: inherit;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation: none; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <h1><img src="crown-deal.svg" width="690" height="256" alt="Kingdom Foundry"></h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="startup-status" role="status">Loading kingdom…</p>
    <button id="startup-retry" type="button" hidden>Retry</button>
  </div>

  <script>
    (() => {
      const splash = document.getElementById('splash');
      const retry = document.getElementById('startup-retry');
      let rendered = false;
      const showError = () => {
        if (rendered) return;
        splash.querySelector('.spinner').hidden = true;
        document.getElementById('startup-status').textContent = 'Kingdom Foundry could not start.';
        retry.hidden = false;
      };
      const timer = window.setTimeout(showError, 20000);
      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('kingdom-startup-error', showError);
      window.addEventListener('flutter-first-frame', () => {
        rendered = true;
        window.clearTimeout(timer);
        splash.style.display = 'none';
      }, { once: true });
    })();
  </script>
  <script src="print_setup.js" defer></script>
  <script src="flutter_bootstrap.js" async onerror="window.dispatchEvent(new Event('kingdom-startup-error'))"></script>
</body>
</html>
